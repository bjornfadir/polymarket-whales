# ─────────────────────────────────────────────
# 🐋 Polymarket Whale Tracker — Config
# ─────────────────────────────────────────────

# Minimum trade size in USD to trigger an alert
min_trade_size: 500

# How often to check for new trades (seconds)
check_interval: 30

telegram:
  # Get a bot token from @BotFather on Telegram
  bot_token: "YOUR_BOT_TOKEN"
  # Your chat ID (use @userinfobot to find it)
  chat_id: "YOUR_CHAT_ID"

polymarket:
  # bjornfadir fork, 2026-08-23: clob.polymarket.com/trades now requires an
  # API key and 401s without one. data-api.polymarket.com/trades is the
  # current public, unauthenticated equivalent -- see main.py's load_config()
  # for the full note.
  api_url: "https://data-api.polymarket.com"
